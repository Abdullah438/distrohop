# distrohop manifest
# Lines are paths relative to $HOME. Edit this file to add or drop items.
# Groups: core apps gtk editor packages dev secrets extra
# Default backup groups: core apps gtk editor packages dev
# Opt-in extras: distrohop backup --secrets

[core]
.zshrc
.p10k.zsh
.bashrc
.bash_profile
.nanorc
.gitconfig
.config/zsh
.config/git

[apps]
.config/fastfetch
.config/alacritty
.config/btop
.config/cava
.config/micro/settings.json
.config/micro/bindings.json
.config/micro/colorschemes
.config/fontconfig
.config/terminal-news
.config/systemd/user
.config/gh/config.yml
.config/mimeapps.list
.config/fish/config.fish
.local/bin/system-age
.local/share/terminal-news

[gtk]
.config/gtk-3.0
.config/gtk-4.0
.gtkrc-2.0

[editor]
.config/Cursor/User/settings.json

[secrets]
.ssh
.config/gh/hosts.yml
.config/rclone/rclone.conf

[dev]
# Extra bind-mount / data dirs under $HOME (git trees are never copied).
Dev/Python/myed-backend/data
Dev/Python/quexter/data

[extra]
# Add anything else you want to keep, one path per line.
# .config/zed
# .config/mpv
